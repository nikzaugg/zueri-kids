# Tests, build and deploy to GitHub Pages (REQ-META-010).
# Minimal permissions; no secrets needed.
name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the deploy job (which runs no project code)
# gets the rights needed to publish to GitHub Pages.
permissions:
  contents: read

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run trace
      - run: npx -w @zueri-kids/web playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
