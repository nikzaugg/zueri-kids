# Tests, build and deploy to GitHub Pages (REQ-META-010).
# Minimal permissions; no secrets needed. Actions are pinned to commit SHAs
# (the comment names the release) to guard against re-pointed tags.
name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the deploy job (which runs no project code)
# gets the rights needed to publish to GitHub Pages.
permissions:
  contents: read

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run trace
      - run: npx -w @zueri-kids/web playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: apps/web/dist }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
